# Builds Jemero-arm64.dmg on an Apple Silicon runner and publishes it as a
# GitHub release. Runs when a version tag (v1.0.0) is pushed, or by hand
# ("Run workflow") on a branch: then the release, and its tag if it doesn't
# exist yet, is made for the commit that was built, named after package.json.
#
# Signing follows electron-builder.config.cjs: with no certificate in the
# repository secrets the app is ad-hoc signed (macOS asks once, under
# Privacy & Security). Add CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID as secrets for a Developer ID,
# notarized build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Release tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($tag)"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm test

      - name: Build the DMG
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # This version's section of the changelog, without its heading.
          awk -v v="$version" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Jemero-arm64.dmg --clobber
          else
            # Creates the tag at the built commit when it doesn't exist yet.
            gh release create "$TAG" release/Jemero-arm64.dmg --title "Jemero $version" --notes-file notes.md --target "$GITHUB_SHA"
          fi
